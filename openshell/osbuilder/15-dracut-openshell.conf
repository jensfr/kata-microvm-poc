# Stripped dracut config for OpenShell on Kata
# Only modules needed for: virtiofs, virtio-net, vsock, serial, nftables, veth
# See RHBAS-4 for the OpenShell module requirements.

drivers+=" vmw_vsock_virtio_transport "
drivers+=" virtio_net "
drivers+=" virtiofs "
drivers+=" virtio_console "
drivers+=" nf_tables nft_reject nft_reject_inet veth "
drivers+=" ptp_kvm "

dracutmodules+=" base systemd-modules-load "
